name: build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      - name: Setup AWS SDK
        uses: ./.github/actions/setup-aws-sdk

      - name: Bazel cache
        uses: actions/cache@v4
        id: bazel_cache
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-bazel-cache


      - name: Configure bazel
        run: |
          {
            echo 'common --//bazel/config:build_enterprise=False'
            echo 'build --bes_results_url=https://app.buildbuddy.io/invocation/'
            echo 'build --bes_backend=grpcs://plebioda.buildbuddy.io'
            echo 'build --remote_cache=grpcs://plebioda.buildbuddy.io'
            echo 'build --noremote_upload_local_results'
            echo 'build --remote_timeout=10m'
            echo 'build --remote_executor=grpcs://plebioda.buildbuddy.io'
            echo 'build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}'
          } > .bazelrc.local

      - name: Build
        run: |
          bazel build --jobs=12 --config=psmdb_dev  //:install-devcore
