name: build

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup environment
        uses: ./.github/actions/setup-env

      # - name: Setup AWS SDK
      #   uses: ./.github/actions/setup-aws-sdk

      - name: Bazel cache
        uses: actions/cache@v4
        id: bazel_cache
        with:
          path: |
            ~/.cache/bazel
            ~/.cache/bazelisk
          key: ${{ runner.os }}-bazel-cache

      - name: Print Bazel / toolchain fingerprint (stdout)
        run: |
          set -euxo pipefail
          uname -a || true
          lsb_release -a || cat /etc/os-release || true

          echo "=== bazel version ==="
          bazel --version || true
          bazel version || true

          echo "=== bazel info ==="
          bazel info release || true
          bazel info workspace || true
          bazel info output_base || true
          bazel info execution_root || true
          bazel info bazel-bin || true
          bazel info host_platform || true
          bazel info java-home || true

          echo "=== compiler/linker ==="
          which gcc || true
          gcc --version || true
          which g++ || true
          g++ --version || true
          which ld.gold || true
          ld.gold --version || true
          which ld.lld || true
          ld.lld --version || true

      - name: Configure bazel
        run: |
          {
            echo 'common --//bazel/config:build_enterprise=False'
            echo 'build --remote_header=x-buildbuddy-api-key=${{ secrets.BUILDBUDDY_API_KEY }}'
          } > .bazelrc.local

      - name: Build
        run: |
          bazel build \
            --jobs=30 \
            --config=psmdb_dev \
            --config=bb \
            --announce_rc \
            --show_result=0 \
            --build_event_text_file=/dev/stdout \
            --verbose_failures \
            //src/...
