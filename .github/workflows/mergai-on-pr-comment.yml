name: mergai-on-pr-comment

on:
  issue_comment:
    types: [created]

jobs:
  mergai-on-pr-comment:
    environment: restricted
    if: >
      github.event.issue.pull_request && startsWith(github.event.comment.body, '/mergai')
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT}}
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION}}
      GOOGLE_GENAI_USE_VERTEXAI: "true"
      PR_NUMBER: ${{ github.event.issue.number }}

    steps:
      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' | base64 -d > $RUNNER_TEMP/gcp-key.json
          chmod 600 $RUNNER_TEMP/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> $GITHUB_ENV

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # or whatever you use locally

      - name: Install gemini-cli
        run: |
          npm install -g @google/gemini-cli

    steps:
      - name: Checkout base branch (post-merge)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.conflictstyle diff3
          git config notes.displayRef refs/notes/mergai-marker

      - name: Fetch notes
        run: |
          git fetch origin refs/notes/mergai-marker:refs/notes/mergai-marker
          git fetch origin refs/notes/mergai:refs/notes/mergai

      - name: Setup MergAI
        uses: ./.github/actions/setup-mergai
        with:
          token: ${{ secrets.PAT }}
          ref: plebioda/dev

      - name: mergai pr add-comments-to-context
        shell: bash
        run: |
          mergai pr --repo $GITHUB_REPOSITORY add-comments-to-context --pr-number $PR_NUMBER
          mergai status

      - name: mergai resolve
        shell: bash
        run: |
          mergai resolve -y
          git status
          git diff
          mergai status

      - name: mergai commit-resolution
        shell: bash
        run: |
          mergai commit
          git show

      - name: Push changes
        run: |
          git push origin refs/notes/mergai-marker
          git push origin refs/notes/mergai
          git push origin "${{ steps.pr.outputs.head_ref }}"

