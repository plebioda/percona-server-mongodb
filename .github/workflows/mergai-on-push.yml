name: mergai-on-push

on:
  push:
    branches:
      - 'mergai/*/baseline'


jobs:
  mergai-on-push:
    environment: restricted
    runs-on: ubuntu-latest

    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to access all branches and commits

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.conflictstyle diff3
          git config notes.displayRef refs/notes/mergai-marker

      - name: Fetch notes
        run: |
          git fetch origin refs/notes/mergai-marker:refs/notes/mergai-marker
          git fetch origin refs/notes/mergai:refs/notes/mergai

      - name: Setup MergAI
        uses: ./.github/actions/setup-mergai
        with:
          token: ${{ secrets.PAT }}
          ref: plebioda/dev

      - name: mergai log
        shell: bash
        run: |
          mergai log

      - name: mergai finalize
        shell: bash
        run: |
          mergai finalize
          git show
