# .github/workflows/mock-workflow.yml
name: mergai-trigger

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to run the workflow against'
        required: false
        default: '9e6366f4b79'
      gemini-model:
        description: 'Gemini model to use for conflict resolution'
        required: false
        default: 'gemini-2.5-flash'

jobs:
  merge-job:
    environment: restricted
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needed to access all branches and commits

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/mongodb/mongo.git
          git fetch upstream

      - name: Verify input commit is valid
        run: |
          if ! git cat-file -e ${{ inputs.commit }}^{commit}; then
            echo "Error: Commit ${{ inputs.commit }} does not exist."
            exit 1
          fi

      - name: Setup MergAI
        uses: ./.github/actions/setup-mergai
        with:
          token: ${{ secrets.PAT }}

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # or whatever you use locally

      - name: Install gemini-cli
        run: |
          npm install -g @google/gemini-cli

      - name: Define base branch name
        run: |
          echo "BASE_BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}" >> $GITHUB_ENV

      - name: Show input parameters
        run: |
          echo "Executing merging workflow:"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ inputs.commit }}"

      - name: Git config
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.conflictstyle diff3
          git config notes.displayRef refs/notes/mergai-marker

      - name: "Creating baseline branch"
        run: |
          BRANCH="mergai/merging-${{ inputs.commit }}-into-${{ env.BASE_BRANCH_NAME }}/baseline"
          git checkout -b $BRANCH
          git push -f origin $BRANCH


      - name: Merge commit
        continue-on-error: true
        run: |
          git merge --no-ff ${{ inputs.commit }}

      - name: Show status
        run: |
          git status

      - name: MergAI: create conflict context
        shell: bash
        run: |
          mergai create-conflict-context
          mergai status

      # - name: Export conflicted files
      #   run: |
      #     CONFLICTED_FILES="$(git diff --name-only --diff-filter=U || true)"
      #     {
      #       echo 'CONFLICTED_FILES<<EOF'
      #       echo "$CONFLICTED_FILES"
