name: mergai bot

on:
  workflow_dispatch:
  push:
    branches:
      - foo

jobs:
  mergai-merge:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.PAT }}
      GOOGLE_CLOUD_PROJECT: ${{ secrets.GOOGLE_CLOUD_PROJECT}}
      GOOGLE_CLOUD_LOCATION: ${{ secrets.GOOGLE_CLOUD_LOCATION}}
      GOOGLE_GENAI_USE_VERTEXAI: "true"

    steps:
      - name: Write GCP credentials
        run: |
          echo '${{ secrets.GCP_CREDENTIALS }}' | base64 -d > $RUNNER_TEMP/gcp-key.json
          chmod 600 $RUNNER_TEMP/gcp-key.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/gcp-key.json" >> $GITHUB_ENV

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # or whatever you use locally

      - name: Install gemini-cli
        run: |
          npm install -g @google/gemini-cli

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: setup credentials
        run: |
          echo "GH_TOKEN=${{ steps.app-token.outputs.token }}" >> $GITHUB_ENV
          git config user.name "mergai-bot[bot]"
          git config user.email "mergai-bot[bot]@users.noreply.github.com"
          git config merge.conflictstyle diff3
          git config notes.displayRef refs/notes/mergai-marker

      - name: Setup MergAI
        uses: ./.github/actions/setup-mergai
        with:
          token: ${{ secrets.PAT }}
          ref: plebioda/dev

      - name: mergai fork init
        run: |
          mergai fork init

      - name: mergai merge-pick
        run: |
          MERGE_PICK=$(mergai fork merge-pick --next)
          echo "MERGE_PICK=$MERGE_PICK" >> $GITHUB_ENV
          echo "Next merge pick is: $MERGE_PICK"
          git show --stat $MERGE_PICK
      
      - name: mergai context init
        run: |
          mergai context init $MERGE_PICK

      - name: merge
        run: |
          mergai branch create main
          mergai context create merge
          if git merge --no-commit --no-ff $MERGE_PICK; then
            echo "Merge successful. Committing merge."
            mergai commit merge
            mergai branch push main
            mergai push #notes
            mergai pr --repo $GITHUB_REPOSITORY create main
          else
            echo "Merge conflict detected. Processing with resolution."
            mergai context create conflict
            mergai branch create conflict
            mergai commit conflict
            mergai branch create solution
            mergai resolve
            mergai commit solution
            mergai branch push solution
            mergai branch push conflict
            mergai push #notes
            mergai pr --repo $GITHUB_REPOSITORY create solution
          fi
