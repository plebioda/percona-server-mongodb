# .github/workflows/mock-workflow.yml
name: Merging Workflow

permissions:
  contents: write      # to push branches
  pull-requests: write # to open PRs

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Commit SHA to run the workflow against'
        required: false
        default: '9e6366f4b79'
      gemini-model:
        description: 'Gemini model to use for conflict resolution'
        required: false
        default: 'gemini-2.5-flash'

jobs:
  merge-job:
    runs-on: ubuntu-latest

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Show input parameters
        run: |
          echo "Executing merging workflow:"
          echo "Branch: ${{ github.ref }}"
          echo "Commit: ${{ inputs.commit }}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history, needed for merges

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'  # or whatever you use locally

      - name: Install gemini-cli
        run: |
          npm install -g @google/gemini-cli

      - name: Define env variables
        run: |
          BASE_BRANCH_NAME=${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}
          echo "BASE_BRANCH=merging-workflow-baseline-${BASE_BRANCH_NAME}-${{ inputs.commit }}" >> $GITHUB_ENV
          echo "HEAD_BRANCH=merging-workflow-solution-${BASE_BRANCH_NAME}-${{ inputs.commit }}" >> $GITHUB_ENV
          echo "USER_NAME=github-actions[bot]" >> $GITHUB_ENV
          echo "USER_EMAIL=github-actions[bot]@users.noreply.github.com" >> $GITHUB_ENV
          echo "UPSTREAM=https://github.com/mongodb/mongo.git" >> $GITHUB_ENV

      - name: "Create merging branch"
        run: |
          git config user.name "${{ env.USER_NAME }}"
          git config user.email "${{ env.USER_EMAIL }}"
          git checkout -b ${{ env.BASE_BRANCH }}
          git push -f origin ${{ env.BASE_BRANCH }}

      - name: Fetch upstream
        run: |
          git remote add upstream ${{ env.UPSTREAM }}
          git fetch upstream

      - name: Merge commit
        continue-on-error: true
        run: |
          git merge --no-ff ${{ inputs.commit }}

      - name: Show status
        run: |
          git status

      - name: Export conflicted files
        run: |
          CONFLICTED_FILES="$(git diff --name-only --diff-filter=U || true)"
          {
            echo 'CONFLICTED_FILES<<EOF'
            echo "$CONFLICTED_FILES"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - name: Commit merge state
        run: |
          git add ${{ env.CONFLICTED_FILES }}
          git commit -m "Merge conflict state after merging ${{ inputs.commit }}"
          git push -f origin ${{ env.BASE_BRANCH }}:${{ env.BASE_BRANCH }}
          git checkout -b ${{ env.HEAD_BRANCH }}

      - name: Resolve conflicts
        run: |
          gemini -m "${{ inputs.gemini-model }}" -y "See @.github/merging_prompt.md and resolve merge conflicts in files: ${{ env.CONFLICTED_FILES }}"
          cat solution.md

      - name: Finalize merge
        run: |
          git add . ':(exclude)solution.md'
          git commit -m "Resolved merge conflicts using Gemini for ${{ inputs.commit }}"
          git push -f origin ${{ env.HEAD_BRANCH }}

      - name: Create Pull Request
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr create \
            --repo plebioda/percona-server-mongodb \
            --title "Automated Merge of ${{ inputs.commit }}" \
            --body-file solution.md \
            --head ${{ env.HEAD_BRANCH }} \
            --base ${{ env.BASE_BRANCH }}


